<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scream Challenge – Playlist Rewind</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#1a0f2e;--panel:#2a1a47;--ink:#f6f0ff;--mute:#b9a8d9;--cyan:#2ee6d6;--amber:#ffb020;--pink:#ff3d81;--yel:#ffd21f;--grn:#3ddc6a;--red:#ff3b3b;--off:#3b2863;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4eefc;--panel:#e6dbf7;--ink:#25103f;--mute:#5c4880;--off:#cdbbea;color-scheme:light}}
:root[data-theme="dark"]{--bg:#1a0f2e;--panel:#2a1a47;--ink:#f6f0ff;--mute:#b9a8d9;--off:#3b2863}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "DM Sans",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 20px 48px}
h1{font:400 clamp(34px,8vw,60px)/1 "Bowlby One",Impact,sans-serif;margin:0 0 8px;letter-spacing:.5px}
.sub{color:var(--mute);margin:0 0 28px}
.stage{background:var(--panel);border-radius:20px;padding:24px 20px 20px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.num{font:400 clamp(64px,15vw,120px)/.95 "Bowlby One",Impact,sans-serif;font-variant-numeric:tabular-nums;min-width:2ch}
.level{font:700 clamp(20px,5vw,30px)/1.2 "DM Sans",sans-serif}
.play{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:20px;align-items:stretch}
.meter{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:4px;height:min(62vh,420px);min-height:300px}
.meter i{display:block;flex:1;background:var(--off);border-radius:3px}
.meter i.on.y{background:var(--yel)}.meter i.on.g{background:var(--grn)}.meter i.on.r{background:var(--red)}
.info{display:flex;flex-direction:column;justify-content:center;min-width:0}
.meter i.pk{outline:2px solid var(--ink);outline-offset:1px}
.bar{height:6px;background:var(--off);border-radius:3px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ink)}
#status{min-height:3.2em;margin:14px 0 0;color:var(--mute)}
#status.big{font:400 clamp(28px,8vw,44px)/1.1 "Bowlby One",Impact,sans-serif;color:var(--ink);min-height:0;margin-bottom:6px}
button{font:700 18px "DM Sans",sans-serif;border:0;border-radius:14px;padding:16px 28px;background:var(--pink);color:#fff;cursor:pointer;min-height:56px}
button.ghost{background:var(--off);color:var(--ink);font-size:15px;min-height:44px;padding:10px 16px}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
#save{display:none}
#save.show{display:flex}
input[type=text]{flex:1 1 200px;min-width:0;font:500 18px "DM Sans",sans-serif;padding:14px 16px;border-radius:14px;border:2px solid var(--off);background:var(--bg);color:var(--ink)}
h2{font:400 24px/1.2 "Bowlby One",Impact,sans-serif;margin:36px 0 12px}
ol{list-style:none;margin:0;padding:0}
li.lb{display:grid;grid-template-columns:2.2ch 1fr auto;gap:14px;padding:12px 4px;border-bottom:1px solid var(--off);align-items:baseline}
li.lb:first-child .nm{color:var(--amber);font-weight:700}
.rk{color:var(--mute);font-variant-numeric:tabular-nums}
.pt{font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--mute)}
details{margin-top:36px;background:var(--panel);border-radius:14px;padding:14px 18px}
summary{cursor:pointer;font-weight:700}
.op{display:grid;gap:14px;margin-top:14px}
.op label{display:grid;gap:6px;color:var(--mute);font-size:15px}
.op dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-variant-numeric:tabular-nums;font-size:15px}
.op dt{color:var(--mute)}.op dd{margin:0}
@media (prefers-reduced-motion:no-preference){.bar b{transition:width .1s linear}}
</style>
</head>
<body>
<main>
<h1>Scream Challenge</h1>
<p class="sub">Playlist Rewind Booth. Teriak sekencang mungkin selama 5 detik.</p>

<section class="stage" aria-live="polite">
  <div class="play">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="info">
      <div class="score"><span class="num" id="num">0</span><span class="level" id="lvl">Belum mulai</span></div>
      <div class="bar" aria-hidden="true"><b id="prog"></b></div>
      <p id="status">Tekan tombol, izinkan mikrofon, lalu teriak.</p>
      <div class="row"><button id="go">Mulai teriak</button></div>
    </div>
  </div>
  <form class="row" id="save" autocomplete="off">
    <input type="text" id="name" maxlength="16" placeholder="Nama atau nickname" aria-label="Nama atau nickname">
    <button type="submit">Simpan skor</button>
  </form>
</section>

<h2>Papan skor</h2>
<ol id="board"></ol>

<details>
  <summary>Panel operator</summary>
  <div class="op">
    <label>Sensitivitas: <span id="sv">5</span> dari 10 (naikkan jika skor sulit mencapai 100)
      <input type="range" id="sens" min="1" max="10" step="1" value="5">
    </label>
    <dl>
      <dt>Volume langsung</dt><dd id="o-db">-</dd>
      <dt>Suara sekitar</dt><dd id="o-amb">-</dd>
      <dt>Rasio suara manusia</dt><dd id="o-vr">-</dd>
      <dt>Skor mentah</dt><dd id="o-raw">-</dd>
    </dl>
    <div class="row" style="margin:0"><button class="ghost" id="reset" type="button">Reset papan skor</button></div>
  </div>
</details>
</main>

<script>
(function(){
const $=id=>document.getElementById(id);
const N=20, meter=$('meter');
for(let i=0;i<N;i++){const s=document.createElement('i');s.className=i<7?'y':i<14?'g':'r';s.style.width=(30+70*i/(N-1))+'%';meter.appendChild(s);}
const segs=[...meter.children];

const LEVELS=[
 [0,'Bisik-bisik','Belum kedengaran dari panggung.'],
 [15,'Ngobrol','Masih sopan. Tambah tenaga.'],
 [35,'Semangat','Mulai ada suaranya.'],
 [55,'Teriak','Orang di sebelah mulai menoleh.'],
 [75,'Banshee','Satu booth kedengaran.'],
 [92,'Legenda konser','Suara paling kencang hari ini.']
];
const lv=s=>{let r=LEVELS[0];for(const l of LEVELS)if(s>=l[0])r=l;return r;};

let ctx,an,td,fd,state='idle',t0=0,ambient=-60,sens=5,disp=0,db=-90,vr=0,sc=0;
let win=[],cal=[],peak=0,peakVr=0,finalScore=0,lastScore=null;

function ceilDb(){return -12-(sens-5)*3;}
function toScore(d){const c=ceilDb(),f=Math.min(ambient+8,c-15);return Math.max(0,Math.min(100,(d-f)/(c-f)*100));}

async function initMic(){
  if(an)return true;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    await ctx.resume();
    const src=ctx.createMediaStreamSource(stream);
    an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;
    src.connect(an);
    td=new Float32Array(an.fftSize);fd=new Float32Array(an.frequencyBinCount);
    return true;
  }catch(e){
    const framed=window.self!==window.top;
    const why=e&&e.name==='NotFoundError'?'Mikrofon tidak ditemukan. Colokkan mikrofon lalu coba lagi.'
      :framed?'Mikrofon diblokir karena halaman ini berjalan di dalam frame claude.ai. Buka file game di hosting sendiri atau localhost.'
      :'Izin mikrofon ditolak. Cek ikon gembok di address bar, lalu coba lagi.';
    setStatus(why+' (kode: '+(e&&e.name||'tidak diketahui')+')');
    return false;
  }
}

function setStatus(t,big){const s=$('status');s.textContent=t;s.className=big?'big':'';}

function sample(){
  an.getFloatTimeDomainData(td);
  let s=0;for(let i=0;i<td.length;i++)s+=td[i]*td[i];
  win.push(s/td.length);if(win.length>8)win.shift();
  const avg=win.reduce((a,b)=>a+b,0)/win.length;
  db=10*Math.log10(avg+1e-12);
  an.getFloatFrequencyData(fd);
  const hz=ctx.sampleRate/an.fftSize;let v=0,t=0;
  for(let i=1;i<fd.length;i++){const f=i*hz;if(f<80||f>8000)continue;const p=Math.pow(10,fd[i]/10);t+=p;if(f>=300&&f<=4000)v+=p;}
  vr=t?v/t:0;
  sc=toScore(db);
}

function frame(now){
  requestAnimationFrame(frame);
  if(!an)return;
  sample();
  const el=now-t0;
  if(state==='calibrating'){
    cal.push(db);
    if(el>=1400){ambient=cal.reduce((a,b)=>a+b,0)/cal.length;state='countdown';t0=now;}
  }else if(state==='countdown'){
    const n=3-Math.floor(el/800);
    if(n<=0){state='recording';t0=now;peak=0;peakVr=0;setStatus('TERIAK!',true);}
    else setStatus(String(n),true);
  }else if(state==='recording'){
    if(sc>peak){peak=sc;peakVr=vr;}
    $('prog').style.width=Math.min(100,el/50)+'%';
    if(el>=5000)finish();
  }
  const target=state==='result'?finalScore:(state==='recording'?sc:(state==='idle'?sc:0));
  disp+=(target-disp)*0.35;
  render(state==='recording'?Math.max(disp,0):disp);
  $('o-db').textContent=db.toFixed(1)+' dBFS';
  $('o-amb').textContent=ambient.toFixed(1)+' dBFS';
  $('o-vr').textContent=(vr*100).toFixed(0)+'%';
  $('o-raw').textContent=sc.toFixed(0);
}

function render(v){
  const on=Math.round(v/100*N);
  const pk=state==='recording'||state==='result'?Math.round((state==='result'?finalScore:peak)/100*N)-1:-1;
  segs.forEach((s,i)=>{s.classList.toggle('on',i<on);s.classList.toggle('pk',i===pk&&pk>=0);});
  const shown=state==='result'?finalScore:Math.round(v);
  $('num').textContent=Math.round(state==='result'?disp:shown);
  const showLvl=state==='recording'||state==='result';
  $('lvl').textContent=showLvl?lv(state==='result'?finalScore:peak)[1]:'Belum mulai';
}

function finish(){
  const f=Math.max(.6,Math.min(1,.6+.4*(peakVr/.5)));
  finalScore=Math.round(peak*f);
  state='result';lastScore=finalScore;
  const l=lv(finalScore);
  setStatus(l[2]+' Skor kamu '+finalScore+'.');
  $('prog').style.width='0%';
  $('go').disabled=false;$('go').textContent='Coba lagi';
  $('save').classList.add('show');$('name').value='';$('name').focus();
}

$('go').addEventListener('click',async()=>{
  if(state==='calibrating'||state==='countdown'||state==='recording')return;
  const ok=await initMic();if(!ok)return;
  $('save').classList.remove('show');
  $('go').disabled=true;
  setStatus('Diam sebentar, mengukur suara sekitar…');
  cal=[];disp=0;finalScore=0;state='calibrating';t0=performance.now();
});

// leaderboard
let mem=[];
function loadBoard(){try{const r=localStorage.getItem('scream-board');if(r)return JSON.parse(r);}catch(e){}return mem;}
function saveBoard(b){mem=b;try{localStorage.setItem('scream-board',JSON.stringify(b));}catch(e){}}
function drawBoard(){
  const b=loadBoard().slice().sort((x,y)=>y.s-x.s).slice(0,10),ol=$('board');
  ol.innerHTML='';
  if(!b.length){const li=document.createElement('li');li.className='empty';li.textContent='Belum ada skor. Jadilah yang pertama.';ol.appendChild(li);return;}
  b.forEach((e,i)=>{
    const li=document.createElement('li');li.className='lb';
    const r=document.createElement('span');r.className='rk';r.textContent=i+1;
    const n=document.createElement('span');n.className='nm';n.textContent=e.n+' ('+lv(e.s)[1]+')';
    const p=document.createElement('span');p.className='pt';p.textContent=e.s;
    li.append(r,n,p);ol.appendChild(li);
  });
}
$('save').addEventListener('submit',e=>{
  e.preventDefault();
  if(lastScore==null)return;
  const n=($('name').value.trim()||'Anonim').slice(0,16);
  const b=loadBoard().concat([{n:n,s:lastScore,t:Date.now()}]);
  saveBoard(b);lastScore=null;drawBoard();
  $('save').classList.remove('show');
  setStatus('Skor tersimpan. Siapa berikutnya?');
});

// operator
$('sens').addEventListener('input',e=>{sens=+e.target.value;$('sv').textContent=sens;});
let armed=false;
$('reset').addEventListener('click',()=>{
  if(!armed){armed=true;$('reset').textContent='Yakin? Klik lagi untuk hapus';setTimeout(()=>{armed=false;$('reset').textContent='Reset papan skor';},3000);return;}
  saveBoard([]);drawBoard();armed=false;$('reset').textContent='Reset papan skor';
});

drawBoard();render(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
